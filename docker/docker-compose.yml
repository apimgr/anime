name: anime

services:
  anime:
    image: ghcr.io/apimgr/anime:latest
    container_name: anime
    restart: unless-stopped
    environment:
      # Hardcoded with sane defaults - NO .env files
      - MODE=production
      - TZ=America/New_York
      # ENABLE_TOR=true is default, no need to specify
    ports:
      # Production: bound to Docker bridge only
      - "172.17.0.1:64580:80"
    volumes:
      - ./rootfs/config/anime:/config
      - ./rootfs/data/anime:/data
    networks:
      - anime

networks:
  anime:
    name: anime
    external: false
